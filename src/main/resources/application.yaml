spring:
  application:
    name: chatLLM
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4.1-nano
          temperature: 0.7
    google:
      genai:
        api-key: ${GOOGLE_API_KEY}
        chat:
          options:
            model: gemini-3.5-flash-lite
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: gemma2:2b
logging:
  level:
    root: WARN